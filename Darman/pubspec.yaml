name: darmaan
description: "A doctor booking app"
publish_to: 'none'


version: 1.1.1+12

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  file_selector: ^1.0.3
  supabase_flutter: ^2.17.1
  google_fonts: ^8.2.1
  video_player: ^2.11.1
  image_cropper: ^12.2.1
  file_picker: ^12.0.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  record: ^6.2.1
  image_picker: ^1.2.3
  video_compress: ^3.1.4
  gal: ^2.3.2
  uuid: ^4.6.0
  agora_rtc_engine: ^6.5.4
  permission_handler: 12.0.1
  flutter_local_notifications: ^22.3.0
  flutter_callkit_incoming: ^3.1.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_launcher_icons: ^0.14.4
  # v11 requires Android API 37. Pin v10 to match this project's API 36 SDK.
  flutter_secure_storage: 10.0.0
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  flutter_cache_manager: ^3.4.2
  flutter_svg: ^2.3.0
  firebase_in_app_messaging: ^0.9.4
  firebase_analytics: ^12.6.0
 

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  # Required fallback icon
  image_path_android: "assets/images/logo/icon_foreground.png"
  image_path_ios: "assets/images/logo/splash_icon.png"

  # Adaptive Android layers
  adaptive_icon_background: "assets/images/logo/icon_background.png"
  adaptive_icon_foreground: "assets/images/logo/icon_foreground.png"


  flutter_lints: ^6.0.0



flutter:

  uses-material-design: true
  
  assets:
    - assets/images/logo/
    - assets/images/branding/
    - assets/icons/solar/linear/
    - assets/icons/solar/bold_duotone/
   
